name: vaa1_compatible
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pip
  - setuptools
  - numpy=2.2.*
  - pandas=2.3.*
  - scipy=1.15.*
  - matplotlib=3.10.*
  - pillow=12.0.*
  - ffmpeg
  # Compatible PyTorch stack - torchvision 0.24 needs PyTorch 2.3-2.4, not 2.9
  - pytorch=2.4.*
  - torchvision=0.19.*  # Compatible with PyTorch 2.4
  - torchaudio=2.4.*    # Compatible with PyTorch 2.4
  # Core dependencies
  - libpng
  - libtiff
  - freetype
  - llvm-openmp
  - libcxx
  # Additional conda-forge packages
  - aiofiles
  - anyio
  - certifi
  - click
  - fastapi
  - filelock
  - huggingface_hub
  - jinja2
  - markupsafe
  - networkx
  - ninja
  - numba
  - packaging
  - psutil
  - pydantic
  - pyyaml
  - regex
  - requests
  - safetensors
  - scikit-image
  - shapely
  - sympy
  - tqdm
  - tokenizers
  - typer
  - typing-extensions
  - uvicorn
  - wheel
  - nltk
  - httpx
  - spacy-model-en_core_web_sm

